<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="h" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker><marker id="hv" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6741d9"/></marker><marker id="hm" markerWidth="5" markerHeight="5" refX="4" refY="2.5" viewBox="0 0 12 12" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#e8a200"/></marker></defs>
<rect x="0" y="0" width="1500" height="880" rx="0" fill="#ffffff" stroke="#ffffff" stroke-width="1.6"/>
<text x="40" y="48" font-size="30" fill="#1e1e1e" font-weight="600" text-anchor="start">Inside the model: how one agent hands its memory to the next</text>
<text x="40" y="80" font-size="16" fill="#495057" font-weight="400" text-anchor="start">What our code does at every hand-off (telepathy/latent.py and telepathy/engine.py). All agents are the same model, loaded once on one GPU.</text>
<rect x="40" y="110" width="885" height="560" rx="16" fill="#fbfbfc" stroke="#495057" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="62" y="146" font-size="21" fill="#1e1e1e" font-weight="600" text-anchor="start">Agent 1 (Planner Agent)</text>
<text x="62" y="170" font-size="15" fill="#495057" font-weight="400" text-anchor="start">1  reads its job and the question,   2  then thinks silently for a few steps</text>
<rect x="80" y="345" width="820" height="115" rx="12" fill="#f1f3f5" stroke="#495057" stroke-width="1.6"/>
<text x="490.0" y="397" font-size="19" fill="#1e1e1e" font-weight="600" text-anchor="middle">NVIDIA Nemotron Nano 4B</text>
<text x="490.0" y="423" font-size="15" fill="#495057" font-weight="400" text-anchor="middle">every layer turns each input into a key and a value (K, V)</text>
<rect x="110" y="515" width="72" height="40" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="1.6"/>
<text x="146.0" y="540" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">You are</text>
<line x1="146.0" y1="515" x2="146.0" y2="464" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="200" y="515" width="72" height="40" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="1.6"/>
<text x="236.0" y="540" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">the</text>
<line x1="236.0" y1="515" x2="236.0" y2="464" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="290" y="515" width="72" height="40" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="1.6"/>
<text x="326.0" y="540" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">Planner</text>
<line x1="326.0" y1="515" x2="326.0" y2="464" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="380" y="515" width="72" height="40" rx="8" fill="#d0ebff" stroke="#1971c2" stroke-width="1.6"/>
<text x="416.0" y="540" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">…question</text>
<line x1="416.0" y1="515" x2="416.0" y2="464" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="520" y="515" width="72" height="40" rx="8" fill="#e5dbff" stroke="#6741d9" stroke-width="1.6"/>
<text x="556.0" y="540" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">thought 1</text>
<line x1="556.0" y1="515" x2="556.0" y2="464" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="610" y="515" width="72" height="40" rx="8" fill="#e5dbff" stroke="#6741d9" stroke-width="1.6"/>
<text x="646.0" y="540" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">thought 2</text>
<line x1="646.0" y1="515" x2="646.0" y2="464" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="700" y="515" width="72" height="40" rx="8" fill="#e5dbff" stroke="#6741d9" stroke-width="1.6"/>
<text x="736.0" y="540" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">thought 3</text>
<line x1="736.0" y1="515" x2="736.0" y2="464" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="790" y="515" width="72" height="40" rx="8" fill="#e5dbff" stroke="#6741d9" stroke-width="1.6"/>
<text x="826.0" y="540" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">thought 4</text>
<line x1="826.0" y1="515" x2="826.0" y2="464" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<text x="110" y="579" font-size="14" fill="#1971c2" font-weight="400" text-anchor="start">words it reads (turned into word vectors)</text>
<text x="520" y="579" font-size="14" fill="#6741d9" font-weight="400" text-anchor="start">silent thoughts fed back in as inputs</text>
<rect x="95" y="228" width="790" height="78" rx="12" fill="#fff3bf" stroke="#e8a200" stroke-width="2"/>
<text x="105" y="216" font-size="1" fill="#1e1e1e" font-weight="400" text-anchor="start"></text>
<line x1="146.0" y1="345" x2="146.0" y2="302" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="116" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="129" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">K</text>
<rect x="150" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="163" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">V</text>
<line x1="236.0" y1="345" x2="236.0" y2="302" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="206" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="219" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">K</text>
<rect x="240" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="253" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">V</text>
<line x1="326.0" y1="345" x2="326.0" y2="302" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="296" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="309" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">K</text>
<rect x="330" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="343" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">V</text>
<line x1="416.0" y1="345" x2="416.0" y2="302" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="386" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="399" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">K</text>
<rect x="420" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="433" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">V</text>
<line x1="556.0" y1="345" x2="556.0" y2="302" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="526" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="539" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">K</text>
<rect x="560" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="573" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">V</text>
<line x1="646.0" y1="345" x2="646.0" y2="302" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="616" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="629" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">K</text>
<rect x="650" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="663" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">V</text>
<line x1="736.0" y1="345" x2="736.0" y2="302" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="706" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="719" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">K</text>
<rect x="740" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="753" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">V</text>
<line x1="826.0" y1="345" x2="826.0" y2="302" stroke="#495057" stroke-width="2" marker-end="url(#h)"/>
<rect x="796" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="809" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">K</text>
<rect x="830" y="252" width="26" height="36" rx="6" fill="#ffffff" stroke="#e8a200" stroke-width="1.6"/>
<text x="843" y="275" font-size="13" fill="#1e1e1e" font-weight="400" text-anchor="middle">V</text>
<text x="490" y="216" font-size="15" fill="#a07000" font-weight="600" text-anchor="middle">the KV cache: the model&#x27;s working memory, at every layer</text>
<path d="M 862 365 C 910 365, 910 535, 868 535" fill="none" stroke="#6741d9" stroke-width="2.2" marker-end="url(#hv)"/>
<text x="900" y="495" font-size="13" fill="#6741d9" font-weight="600" text-anchor="end">fed back</text>
<rect x="80" y="596" width="820" height="56" rx="10" fill="#e5dbff" stroke="#6741d9" stroke-width="1.6"/>
<text x="100" y="620" font-size="14" fill="#1e1e1e" font-weight="400" text-anchor="start">Silent step: instead of turning its last internal state into a word, the model rescales that state to the size of a</text>
<text x="100" y="641" font-size="14" fill="#1e1e1e" font-weight="400" text-anchor="start">normal word vector and feeds it straight back in. No word is written, but the KV cache grows by one position.</text>
<path d="M 888 270 C 950 270, 975 300, 1008 300" fill="none" stroke="#e8a200" stroke-width="3.5" stroke-dasharray="10 7" marker-end="url(#hm)"/>
<text x="967" y="236" font-size="13" fill="#a07000" font-weight="600" text-anchor="middle">hand over</text>
<text x="967" y="252" font-size="13" fill="#a07000" font-weight="600" text-anchor="middle">the KV cache</text>
<rect x="1010" y="110" width="450" height="560" rx="16" fill="#fbfbfc" stroke="#495057" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="1032" y="146" font-size="21" fill="#1e1e1e" font-weight="600" text-anchor="start">Agent 2 (Critic Agent)</text>
<text x="1032" y="170" font-size="15" fill="#495057" font-weight="400" text-anchor="start">starts from Agent 1&#x27;s memory instead of notes</text>
<rect x="1030" y="190" width="410" height="150" rx="12" fill="#ffffff" stroke="#495057" stroke-width="1.6"/>
<text x="1045" y="215" font-size="15" fill="#1e1e1e" font-weight="600" text-anchor="start">its KV cache</text>
<rect x="1045" y="230" width="200" height="92" rx="10" fill="#fff3bf" stroke="#e8a200" stroke-width="2"/>
<text x="1145" y="262" font-size="14" fill="#a07000" font-weight="600" text-anchor="middle">from Agent 1</text>
<text x="1145" y="284" font-size="13" fill="#a07000" font-weight="400" text-anchor="middle">(what it read</text>
<text x="1145" y="301" font-size="13" fill="#a07000" font-weight="400" text-anchor="middle">and thought)</text>
<text x="1262" y="282" font-size="26" fill="#1e1e1e" font-weight="600" text-anchor="middle">+</text>
<rect x="1280" y="230" width="145" height="92" rx="10" fill="#fff3bf" stroke="#e8a200" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="1352" y="262" font-size="14" fill="#a07000" font-weight="600" text-anchor="middle">its own job</text>
<text x="1352" y="284" font-size="13" fill="#a07000" font-weight="400" text-anchor="middle">and silent</text>
<text x="1352" y="301" font-size="13" fill="#a07000" font-weight="400" text-anchor="middle">thoughts</text>
<rect x="1030" y="370" width="410" height="120" rx="12" fill="#f1f3f5" stroke="#495057" stroke-width="1.6"/>
<text x="1045" y="398" font-size="15" fill="#1e1e1e" font-weight="400" text-anchor="start">It reads only its own job prompt.</text>
<text x="1045" y="422" font-size="15" fill="#1e1e1e" font-weight="400" text-anchor="start">Through the cache it can pay attention</text>
<text x="1045" y="446" font-size="15" fill="#1e1e1e" font-weight="400" text-anchor="start">to everything Agent 1 read and thought,</text>
<text x="1045" y="470" font-size="15" fill="#1e1e1e" font-weight="400" text-anchor="start">without rereading a single word.</text>
<rect x="1030" y="515" width="410" height="135" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="1.6"/>
<text x="1045" y="545" font-size="15" fill="#1e1e1e" font-weight="400" text-anchor="start">… the Refiner Agent does the same, then</text>
<text x="1045" y="572" font-size="15" fill="#1e1e1e" font-weight="600" text-anchor="start">the Solver Agent reads its job on top of the</text>
<text x="1045" y="596" font-size="15" fill="#1e1e1e" font-weight="600" text-anchor="start">full cache and is the only one that writes:</text>
<text x="1045" y="625" font-size="15" fill="#1e1e1e" font-weight="600" text-anchor="start">the answer, word by word.</text>
<rect x="40" y="700" width="1420" height="150" rx="14" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.6"/>
<text x="60" y="732" font-size="17" fill="#1e1e1e" font-weight="600" text-anchor="start">Good to know</text>
<text x="60" y="762" font-size="15" fill="#1e1e1e" font-weight="400" text-anchor="start">•  Each memory is tagged with the run that made it and can never be reused by another run.</text>
<text x="60" y="790" font-size="15" fill="#1e1e1e" font-weight="400" text-anchor="start">•  An agent that reads web pages hands off in plain, checked text instead, so nothing from the web travels hidden in the memory.</text>
<text x="60" y="818" font-size="15" fill="#1e1e1e" font-weight="400" text-anchor="start">•  Method credit: LatentMAS (Apache-2.0). Where LatentMAS uses an alignment matrix before feeding a state back, we simply rescale it to word size.</text>
</svg>